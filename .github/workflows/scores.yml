name: Scores

on:
  schedule:
    # NFL game windows, in UTC, Sep–Jan. Every 10 min while games are on;
    # an hourly sweep covers Thanksgiving/Saturday/holiday games and the
    # odd "final" that lands outside a window.
    - cron: "*/10 0-5 * 9-12,1 5"    # Thu night  (Fri 00:00–05:59 UTC)
    - cron: "*/10 13-23 * 9-12,1 0"  # Sunday     (13:00–23:59 UTC; London games onward)
    - cron: "*/10 0-5 * 9-12,1 1"    # Sun night  (Mon 00:00–05:59 UTC)
    - cron: "*/10 0-5 * 9-12,1 2"    # Mon night  (Tue 00:00–05:59 UTC)
    - cron: "5 * * 9-12,1 *"         # hourly sweep (:05 so it never lands on a */10 tick)
  workflow_dispatch:
    inputs:
      season:
        description: "season year"
        default: "2026"
      week:
        description: "week number (blank = latest ingested week)"
        default: ""

permissions:
  contents: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch scores, commit & push (retry on race)
        env:
          SEASON: ${{ github.event.inputs.season || '2026' }}
          WEEK: ${{ github.event.inputs.week || 'latest' }}
        run: |
          git config user.name  "tsg-pickem-bot"
          git config user.email "actions@users.noreply.github.com"
          # Two runs can overlap (cron jitter, dispatch during a window). Instead of
          # rebasing a regenerated JSON file onto a newer one, start from origin/main
          # and regenerate; the fetch is the source of truth, so nothing is lost.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/scores.py --season "$SEASON" --week "$WEEK"
            if [ -z "$(git status --porcelain data)" ]; then echo "no changes"; exit 0; fi
            git add data
            git commit -m "scores $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          echo "gave up after 3 attempts"; exit 1
